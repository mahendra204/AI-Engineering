name: AI Engineering CI

on:
  pull_request:
    paths:
      - "rag_app/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "rag_app/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag_app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./rag_app
          file: ./rag_app/Dockerfile
          push: false
          tags: ai-engineering-rag:ci